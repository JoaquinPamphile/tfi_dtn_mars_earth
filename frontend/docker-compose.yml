# Laboratorio DTN — shell de desarrollo.
# No ejecuta campañas ni forma parte de la evidencia RC1.
name: tfi-dtn-lab

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tfi-dtn-lab:dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Lectura de los JSON RC1. No se copian a frontend/ ni se montan con escritura.
      - ../evidence:/evidence:ro
      - lab_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    init: true

volumes:
  lab_node_modules:
